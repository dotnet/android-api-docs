<section class="detail" id="forEach(java.util.function.Consumer)">
<h3>forEach</h3>
<div class="member-signature"><span class="return-type">void</span> <span class="element-name">forEach</span>(Consumer action)</div>
<div class="block">Performs the given action for each element of the <code>Iterable</code> until all elements have been processed or the action throws an exception.</div>
<dl class="notes">
<dt>Parameters:</dt>
<dd><code>action</code> - The action to be performed for each element</dd>
</dl>
